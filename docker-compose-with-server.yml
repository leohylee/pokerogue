# Full setup with backend server for online features
# Use this if you want user accounts, cloud saves, and daily challenges

services:
  # PostgreSQL database for user data
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pokerogue
      POSTGRES_PASSWORD: pokerogue
      POSTGRES_DB: pokerogue
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Backend API server
  rogueserver:
    build:
      context: ../rogueserver
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=pokerogue
      - DB_PASSWORD=pokerogue
      - DB_NAME=pokerogue
    depends_on:
      - postgres
    restart: unless-stopped
    container_name: rogueserver

  # Frontend game client
  pokerogue:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - VITE_BYPASS_LOGIN=0  # Enable login (not bypass)
      - VITE_BYPASS_TUTORIAL=0
      - VITE_SERVER_URL=http://localhost:8001
      - PORT=8000
      - NODE_ENV=development
    volumes:
      - ./assets:/app/assets:ro
      - ./locales:/app/locales:ro
    depends_on:
      - rogueserver
    restart: unless-stopped
    container_name: pokerogue-app

volumes:
  postgres_data:
